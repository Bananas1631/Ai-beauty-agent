# Alembic settings. Run commands from the project root: poetry run alembic upgrade head
# ASCII only: Alembic reads this file in the system encoding (cp1251 on Russian Windows).
# No database URL here: env.py takes it from the application settings (.env).

[alembic]
# %(here)s is the folder of this file
script_location = %(here)s/src/beauty_agent/db/migrations
# Migration file name: 0001_init.py
file_template = %%(rev)s_%%(slug)s
path_separator = os

[post_write_hooks]
# A new migration is formatted and fixed by ruff, like the rest of the code
hooks = ruff_format, ruff_fix
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME


# Console logs of alembic commands
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
