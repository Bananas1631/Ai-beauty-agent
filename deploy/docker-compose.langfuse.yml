# Self-hosted Langfuse на своём сервере в РФ: тексты диалогов клиентов не уходят за рубеж (152-ФЗ).
# Отдельный файл и лучше отдельный VPS (4+ ГБ ОЗУ): Langfuse тяжёлый, а make up должен оставаться лёгким.
#
#   cp deploy/langfuse.env.example deploy/langfuse.env   # заполнить секреты: openssl rand -hex 32
#   docker compose -f deploy/docker-compose.langfuse.yml --env-file deploy/langfuse.env up -d
#
# Интерфейс слушает только 127.0.0.1:3000 — наружу через Caddy с HTTPS или SSH-туннель.
# Версии образов Langfuse проверить на совместимость с SDK (pyproject.toml: langfuse) перед обновлением.
name: langfuse

x-langfuse-env: &langfuse-env
  DATABASE_URL: postgresql://langfuse:${LANGFUSE_DB_PASSWORD:?задайте LANGFUSE_DB_PASSWORD}@langfuse-postgres:5432/langfuse
  SALT: ${LANGFUSE_SALT:?задайте LANGFUSE_SALT}
  ENCRYPTION_KEY: ${LANGFUSE_ENCRYPTION_KEY:?задайте LANGFUSE_ENCRYPTION_KEY — 64 hex-символа}
  NEXTAUTH_SECRET: ${LANGFUSE_NEXTAUTH_SECRET:?задайте LANGFUSE_NEXTAUTH_SECRET}
  NEXTAUTH_URL: ${LANGFUSE_URL:-http://localhost:3000}
  TELEMETRY_ENABLED: "false"
  LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES: "false"
  CLICKHOUSE_URL: http://langfuse-clickhouse:8123
  CLICKHOUSE_MIGRATION_URL: clickhouse://langfuse-clickhouse:9000
  CLICKHOUSE_USER: langfuse
  CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD:?задайте LANGFUSE_CLICKHOUSE_PASSWORD}
  CLICKHOUSE_CLUSTER_ENABLED: "false"
  REDIS_HOST: langfuse-redis
  REDIS_PORT: "6379"
  REDIS_AUTH: ${LANGFUSE_REDIS_PASSWORD:?задайте LANGFUSE_REDIS_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
  LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://langfuse-minio:9000
  LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
  LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${LANGFUSE_MINIO_PASSWORD:?задайте LANGFUSE_MINIO_PASSWORD}
  LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
  # Регистрация закрыта: пользователей создаёт администратор
  AUTH_DISABLE_SIGNUP: "true"

x-defaults: &defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  langfuse-web:
    <<: *defaults
    image: langfuse/langfuse:3
    environment: *langfuse-env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      langfuse-postgres:
        condition: service_healthy
      langfuse-clickhouse:
        condition: service_healthy
      langfuse-redis:
        condition: service_healthy
      langfuse-minio:
        condition: service_healthy

  langfuse-worker:
    <<: *defaults
    image: langfuse/langfuse-worker:3
    environment: *langfuse-env
    depends_on:
      - langfuse-web

  langfuse-postgres:
    <<: *defaults
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: ${LANGFUSE_DB_PASSWORD}
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U langfuse -d langfuse"]
      interval: 10s
      timeout: 3s
      retries: 10

  langfuse-clickhouse:
    <<: *defaults
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${LANGFUSE_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DB: default
    volumes:
      - langfuse_clickhouse:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8123/ping || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  langfuse-redis:
    <<: *defaults
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${LANGFUSE_REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory-policy noeviction"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  langfuse-minio:
    <<: *defaults
    image: minio/minio:latest
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && exec minio server /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${LANGFUSE_MINIO_PASSWORD}
    volumes:
      - langfuse_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  langfuse_pg:
  langfuse_clickhouse:
  langfuse_minio:
