# Локальное окружение разработки.
# Запуск из корня проекта: make up, остановка: make down.
# Относительные пути в этом файле считаются от папки deploy/.
name: beauty-agent

services:
  api: &app
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file: ../.env
    environment: &app-env
      # Внутри сети Docker сервис находится по имени, а не по localhost
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # Сведения о сайте: local (свой RAG), shadow (сравнение с индексатором) или indexer (ADR 014)
      KNOWLEDGE_BACKEND: ${KNOWLEDGE_BACKEND:-local}
      KNOWLEDGE_INDEXER_URL: http://indexer:8001
      CLICKHOUSE_HOST: clickhouse
    ports:
      - "127.0.0.1:8000:8000"
    depends_on: &app-deps
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Воркер Celery из того же образа: входящие сообщения мессенджеров и фоновые задачи
  worker:
    <<: *app
    ports: []
    environment:
      <<: *app-env
      # метрики дочерних процессов — в общую папку, сводку отдаёт главный процесс на 9100
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      METRICS_PORT: "9100"
      POSTGRES_POOL_SIZE: "3"  # одна задача на процесс — большой пул не нужен
      POSTGRES_MAX_OVERFLOW: "2"
    command: ["celery", "-A", "beauty_agent.workers.celery_app", "worker", "-Q", "messages,periodic",
              "--concurrency", "2", "--loglevel", "INFO"]
    healthcheck:
      disable: true

  # Расписание фоновых задач: напоминания, хранение данных, синхронизация каталога
  beat:
    <<: *app
    ports: []
    command: ["celery", "-A", "beauty_agent.workers.celery_app", "beat", "--loglevel", "INFO",
              "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  # Relay доменных событий: event_outbox → Kafka (events/outbox_relay.py, ADR 013).
  # Несколько экземпляров не мешают друг другу: салон публикует тот, кто взял его блокировку
  relay:
    <<: *app
    ports: []
    command: ["python", "-m", "beauty_agent.events.outbox_relay"]
    environment:
      <<: *app-env
      METRICS_PORT: "9101"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      disable: true

  # Потребители доменных событий: weekly-stats — недельная статистика для отчётов, knowledge-sync —
  # результат переиндексации из индексатора, partner-webhooks — подписанные вебхуки партнёрам.
  # Масштабирование — replicas: Kafka раздаст экземплярам 6 партиций и перераспределит при остановке
  consumers:
    <<: *app
    ports: []
    command: ["python", "-m", "beauty_agent.events.consumers", "weekly-stats", "knowledge-sync", "partner-webhooks"]
    environment:
      <<: *app-env
      METRICS_PORT: "9102"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      disable: true

  # Индексатор сайтов — отдельный сервис со своей схемой knowledge (ADR 014): REST-поиск для агента.
  # Схема: make migrate (миграции основного сервиса и индексатора)
  indexer:
    build:
      context: ..
      dockerfile: services/indexer/Dockerfile
    env_file: ../.env
    environment: &indexer-env
      POSTGRES_HOST: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      INDEXER_JWKS_URL: http://api:8000/.well-known/jwks.json
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      postgres:
        condition: service_healthy

  # Воркер индексатора: site.reindex.requested из Kafka → обход сайта → knowledge.updated через свой outbox
  indexer-worker:
    build:
      context: ..
      dockerfile: services/indexer/Dockerfile
    env_file: ../.env
    environment:
      <<: *indexer-env
      METRICS_PORT: "9103"
    command: ["python", "-m", "beauty_indexer.worker"]
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    healthcheck:
      disable: true

  # Только локально: Telegram через long polling (вебхуку нужен публичный HTTPS).
  # Запуск: docker compose -f deploy/docker-compose.yml --profile telegram up -d
  bot:
    <<: *app
    ports: []
    profiles: ["telegram"]
    command: ["python", "-m", "beauty_agent.workers.telegram_polling"]
    healthcheck:
      disable: true

  # Мониторинг: docker compose -f deploy/docker-compose.yml --profile monitoring up -d
  # Grafana — http://localhost:3000 (admin / пароль из GRAFANA_ADMIN_PASSWORD)
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoring"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus
    ports:
      - "127.0.0.1:9090:9090"

  grafana:
    image: grafana/grafana:11.4.0
    profiles: ["monitoring"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GRAFANA_ALERT_BOT_TOKEN: ${GRAFANA_ALERT_BOT_TOKEN:-}
      GRAFANA_ALERT_CHAT_ID: ${GRAFANA_ALERT_CHAT_ID:-}
      # Источник ClickHouse для дашборда аналитики — только локально (в проде ClickHouse появится в шаге 25)
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource 4.0.0
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-beauty}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./grafana/clickhouse/datasource.yml:/etc/grafana/provisioning/datasources/clickhouse.yml:ro
      - ./grafana/clickhouse/analytics.json:/var/lib/grafana/dashboards/analytics.json:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beauty}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beauty}
      POSTGRES_DB: ${POSTGRES_DB:-beauty}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: проверять по сети, а не через сокет (почему — в разборе)
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Kafka в режиме KRaft: один узел — и брокер, и контроллер (для разработки).
  # Изнутри сети Docker — kafka:9092, с хоста — localhost:9094. Топики создаёт relay
  # (6 партиций, хранение 7 дней), автосоздание выключено: опечатка не создаст новый топик
  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 5mujQ_vQSM6TGzpjd86_lw  # UUID в base64 — любой, но постоянный для тома kafkadata
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:9094:9094"
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Kafka UI — топики, сообщения, группы и lag: docker compose -f deploy/docker-compose.yml --profile events up -d
  # http://localhost:8080 — только с этой машины
  kafka-ui:
    image: kafbat/kafka-ui:v1.2.0
    profiles: ["events"]
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      DYNAMIC_CONFIG_ENABLED: "false"
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      kafka:
        condition: service_healthy

  # ClickHouse — аналитика событий (шаг 24): сам читает топики Kafka своей группой clickhouse
  # (deploy/clickhouse/init.sql, без кода на Python). При первом старте заливает историю — всё, что
  # хранится в Kafka. Отчёты из него — CLICKHOUSE_ENABLED=true. HTTP 8123 — только с этой машины.
  # Запуск: docker compose -f deploy/docker-compose.yml --profile analytics up -d
  clickhouse:
    image: clickhouse/clickhouse-server:25.3
    profiles: ["analytics"]
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-beauty}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-beauty}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "0"
    ports:
      - "127.0.0.1:8123:8123"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./clickhouse/kafka.xml:/etc/clickhouse-server/config.d/kafka.xml:ro
      - clickhousedata:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 12

  rabbitmq:
    image: rabbitmq:4-management-alpine
    # RabbitMQ хранит данные в папке с именем узла, а оно строится из hostname
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-beauty}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-beauty}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  kafkadata:
  clickhousedata:
  prometheusdata:
  grafanadata:
