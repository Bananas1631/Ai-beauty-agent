# Prometheus: что и как часто собирать. Метрики описаны в src/beauty_agent/core/metrics.py.
# /metrics api закрыт снаружи в Caddy — Prometheus ходит внутри сети Docker.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Главный процесс воркера Celery отдаёт сводку метрик всех дочерних процессов
  - job_name: worker
    static_configs:
      - targets: ["worker:9100"]

  # Доменные события: relay (очередь outbox) и потребители (lag, DLQ)
  - job_name: events
    static_configs:
      - targets: ["relay:9101", "consumers:9102"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
