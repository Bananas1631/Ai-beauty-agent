# Контейнеры на сервере: api, воркеры Celery, postgres, redis, rabbitmq и Caddy (вход из интернета с HTTPS).
# Лежит на сервере в /opt/beauty-agent рядом с .env и Caddyfile; обновляет его деплой из CI.
#   docker compose -f docker-compose.prod.yml up -d
# В отличие от локального compose: порты баз и брокера наружу не открыты, секреты — только из .env,
# у логов ротация (по умолчанию Docker пишет логи без ограничений, и диск заполняется).
name: beauty-agent

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  api: &app
    <<: *hardening
    image: "${APP_IMAGE:?APP_IMAGE не задан — ghcr.io/<owner>/<repo>:<sha>}"
    env_file: .env
    environment:
      APP_ENV: prod
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      # api доступен только из внутренней сети Docker через Caddy, поэтому X-Forwarded-For
      # от Caddy можно доверять: по нему считаются лимиты частоты на IP
      FORWARDED_ALLOW_IPS: "*"
    expose:
      - "8000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # корневой сертификат Минцифры для API мессенджера MAX (docs/integrations/max.md)
      - ./certs:/certs:ro
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Воркер Celery из того же образа: входящие сообщения мессенджеров и фоновые задачи
  worker:
    <<: *app
    expose: []
    environment:
      APP_ENV: prod
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      # метрики дочерних процессов — в tmpfs, сводку отдаёт главный процесс на 9100 (только внутри сети)
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      METRICS_PORT: "9100"
      # процесс воркера обрабатывает одну задачу за раз: большой пул ему не нужен.
      # Соединений всего: api 15 + 4 процесса × 5 + beat 15 = 50 из 100 у PostgreSQL
      POSTGRES_POOL_SIZE: "3"
      POSTGRES_MAX_OVERFLOW: "2"
    command: ["celery", "-A", "beauty_agent.workers.celery_app", "worker", "-Q", "messages,periodic",
              "--concurrency", "4", "--loglevel", "INFO"]
    healthcheck:
      disable: true

  # Расписание фоновых задач; файл расписания — во временной папке (контейнер только для чтения)
  beat:
    <<: *app
    expose: []
    command: ["celery", "-A", "beauty_agent.workers.celery_app", "beat", "--loglevel", "INFO",
              "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  postgres:
    <<: *hardening
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан}
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    <<: *hardening
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD не задан}
    # пароль из переменной окружения контейнера, а не в открытом виде в compose
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  rabbitmq:
    <<: *hardening
    image: rabbitmq:4-alpine
    # RabbitMQ хранит данные в папке с именем узла, а оно строится из hostname
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER не задан}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD не задан}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Мониторинг. Наружу не открыт: Grafana — через SSH-туннель (ssh -L 3000:127.0.0.1:3000 сервер)
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus

  grafana:
    <<: *hardening
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD не задан}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GRAFANA_ALERT_BOT_TOKEN: ${GRAFANA_ALERT_BOT_TOKEN:?GRAFANA_ALERT_BOT_TOKEN не задан}
      GRAFANA_ALERT_CHAT_ID: ${GRAFANA_ALERT_CHAT_ID:?GRAFANA_ALERT_CHAT_ID не задан}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  caddy:
    <<: *hardening
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN не задан}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL не задан}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  caddy_data:
  caddy_config:
  prometheusdata:
  grafanadata:
