# Контейнеры на сервере: api, воркеры Celery, postgres, redis, rabbitmq, Kafka с relay и потребителями
# событий, мониторинг и Caddy (вход из интернета с HTTPS).
# Лежит на сервере в /opt/beauty-agent рядом с .env и Caddyfile; обновляет его деплой из CI.
#   docker compose -f docker-compose.prod.yml up -d
# В отличие от локального compose: порты баз и брокера наружу не открыты, секреты — только из .env,
# у логов ротация (по умолчанию Docker пишет логи без ограничений, и диск заполняется).
name: beauty-agent

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  logging: *logging

services:
  api: &app
    <<: *hardening
    image: "${APP_IMAGE:?APP_IMAGE не задан — ghcr.io/<owner>/<repo>:<sha>}"
    env_file: .env
    environment:
      APP_ENV: prod
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # api доступен только из внутренней сети Docker через Caddy, поэтому X-Forwarded-For
      # от Caddy можно доверять: по нему считаются лимиты частоты на IP
      FORWARDED_ALLOW_IPS: "*"
    expose:
      - "8000"
    # время дописать ответы перед остановкой (uvicorn --timeout-graceful-shutdown 25)
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # корневой сертификат Минцифры для API мессенджера MAX (docs/integrations/max.md)
      - ./certs:/certs:ro
    cap_drop:
      - ALL
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Воркер Celery из того же образа: входящие сообщения мессенджеров и фоновые задачи
  worker:
    <<: *app
    expose: []
    environment:
      APP_ENV: prod
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      # метрики дочерних процессов — в tmpfs, сводку отдаёт главный процесс на 9100 (только внутри сети)
      PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus
      METRICS_PORT: "9100"
      # процесс воркера обрабатывает одну задачу за раз: большой пул ему не нужен.
      # Соединений всего: api 15 + 4 процесса × 5 + beat 15 = 50 из 100 у PostgreSQL
      POSTGRES_POOL_SIZE: "3"
      POSTGRES_MAX_OVERFLOW: "2"
    command: ["celery", "-A", "beauty_agent.workers.celery_app", "worker", "-Q", "messages,periodic",
              "--concurrency", "4", "--loglevel", "INFO"]
    # воркер дорабатывает текущую задачу (time limit задачи — 300 с, обычно секунды);
    # недоделанная после SIGKILL вернётся в очередь — acks_late
    stop_grace_period: 60s
    healthcheck:
      disable: true

  # Расписание фоновых задач; файл расписания — во временной папке (контейнер только для чтения)
  beat:
    <<: *app
    expose: []
    command: ["celery", "-A", "beauty_agent.workers.celery_app", "beat", "--loglevel", "INFO",
              "--schedule", "/tmp/celerybeat-schedule"]
    healthcheck:
      disable: true

  # Relay доменных событий: event_outbox → Kafka. Источник правды — PostgreSQL: бэкап Kafka не нужен,
  # потерянное публикуется заново из outbox
  relay:
    <<: *app
    expose: []
    environment:
      APP_ENV: prod
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      METRICS_PORT: "9101"
      POSTGRES_POOL_SIZE: "2"
      POSTGRES_MAX_OVERFLOW: "1"
    command: ["python", "-m", "beauty_agent.events.outbox_relay"]
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Потребители событий: группа weekly-stats копит статистику для еженедельных отчётов.
  # Отчёт переключается на неё (KAFKA_ENABLED=true в .env) после первой полной недели статистики
  consumers:
    <<: *app
    expose: []
    environment:
      APP_ENV: prod
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      METRICS_PORT: "9102"
      POSTGRES_POOL_SIZE: "2"
      POSTGRES_MAX_OVERFLOW: "1"
    command: ["python", "-m", "beauty_agent.events.consumers", "weekly-stats"]
    stop_grace_period: 20s
    deploy:
      resources:
        limits:
          memory: 256m
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy

  # Kafka: один узел KRaft (брокер и контроллер), только внутри сети Docker.
  # Память ограничена: куча JVM 512 МБ, контейнер 1 ГБ (кэш страниц ОС — за пределами кучи)
  kafka:
    <<: *hardening
    image: apache/kafka:3.9.1
    hostname: kafka
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      # UUID в base64, один раз на сервер: python -c "import base64,uuid;print(base64.urlsafe_b64encode(uuid.uuid4().bytes).rstrip(b'=').decode())"
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID не задан}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_RETENTION_HOURS: "168"
      KAFKA_HEAP_OPTS: -Xms512m -Xmx512m
    volumes:
      - kafkadata:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          memory: 1g
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgres:
    <<: *hardening
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER не задан}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD не задан}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB не задан}
    shm_size: 256mb
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    <<: *hardening
    image: redis:8-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD не задан}
    # пароль из переменной окружения контейнера, а не в открытом виде в compose
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 10

  rabbitmq:
    <<: *hardening
    image: rabbitmq:4-alpine
    # RabbitMQ хранит данные в папке с именем узла, а оно строится из hostname
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?RABBITMQ_USER не задан}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD не задан}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # Мониторинг. Наружу не открыт: Grafana — через SSH-туннель (ssh -L 3000:127.0.0.1:3000 сервер)
  prometheus:
    <<: *hardening
    image: prom/prometheus:v3.1.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=30d"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus

  grafana:
    <<: *hardening
    image: grafana/grafana:11.4.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD не задан}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GRAFANA_ALERT_BOT_TOKEN: ${GRAFANA_ALERT_BOT_TOKEN:?GRAFANA_ALERT_BOT_TOKEN не задан}
      GRAFANA_ALERT_CHAT_ID: ${GRAFANA_ALERT_CHAT_ID:?GRAFANA_ALERT_CHAT_ID не задан}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus

  caddy:
    <<: *hardening
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN не задан}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL не задан}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  rabbitmqdata:
  kafkadata:
  caddy_data:
  caddy_config:
  prometheusdata:
  grafanadata:
