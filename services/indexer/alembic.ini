# Миграции индексатора (схема knowledge). Из корня проекта:
#   poetry run alembic -c services/indexer/alembic.ini upgrade head
[alembic]
script_location = %(here)s/beauty_indexer/migrations
file_template = %%(rev)s_%%(slug)s
path_separator = os
prepend_sys_path = %(here)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
