# Раз в неделю Dependabot открывает PR с обновлениями: зависимости Python, GitHub Actions
# и базовые Docker-образы. Обновления безопасности приходят сразу, без расписания.
version: 2
updates:
  - package-ecosystem: pip  # понимает pyproject.toml и poetry.lock
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        dependency-type: development
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "ci"

  - package-ecosystem: docker
    directory: /deploy
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: "chore(docker)"
